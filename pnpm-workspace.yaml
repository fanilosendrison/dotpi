packages:
  - .
  - '!extensions/pi-subagents-4-turnlock/**'

# Preserved gateway symlinks require transitive packages to be root-resolvable.
shamefullyHoist: true
engineStrict: true
autoInstallPeers: false

overrides:
  '@earendil-works/pi-agent-core': 0.84.2
  '@earendil-works/pi-ai': 0.84.2
  '@earendil-works/pi-client': 0.84.2
  '@earendil-works/pi-protocol': 0.84.2
  '@earendil-works/pi-telemetry': 0.84.2
  '@earendil-works/pi-tui': 0.84.2

minimumReleaseAgeExclude:
  - '@fanilosendrison/event-sink@0.1.0'

name: Bun 1.3.14 baseline

on:
  push:
    branches:
      - migration/node-pnpm
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-suite:
    name: Historical suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out dotpi candidate
        uses: actions/checkout@v4
        with:
          path: dotpi
          persist-credentials: false

      - name: Check out exact dotagents baseline
        uses: actions/checkout@v4
        with:
          repository: fanilosendrison/dotagents
          ref: 3516a87e52b51e607fad387703a0b47c99751adf
          path: dotagents
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Verify runtimes and immutable checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(node --version)" = "v22.19.0"
          test "$(pnpm --version)" = "11.24.0"
          test "$(git -C dotpi rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C dotagents rev-parse HEAD)" = "3516a87e52b51e607fad387703a0b47c99751adf"

      - name: Install baseline dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dotagents
            bun run test:install
          )
          (
            cd dotpi
            pnpm install --frozen-lockfile --ignore-scripts
          )

      - name: Install exact global Pi Jiti fallback
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts \
            @earendil-works/pi-coding-agent@0.84.2
          test "$(pi --version)" = "0.84.2"

      - name: Build historical gateways and compatibility aliases
        shell: bash
        run: |
          set -euo pipefail
          dotagents="$GITHUB_WORKSPACE/dotagents"
          dotpi="$GITHUB_WORKSPACE/dotpi"
          baseline_home="$RUNNER_TEMP/dotpi-baseline-home"

          rm -rf "$baseline_home"
          mkdir -p "$baseline_home/.pi" "$baseline_home/node_modules"
          ln -s "$dotagents" "$baseline_home/.agents"
          ln -s "$dotpi" "$baseline_home/.pi/agent"
          ln -s "$dotpi/node_modules/jiti" "$baseline_home/node_modules/jiti"

          # Remaining baseline-only aliases preserve historical dotagents and
          # dotpi imports until their dedicated portability batches migrate.
          sudo mkdir -p /Users/famillesendrison/.pi
          sudo ln -s "$dotagents" /Users/famillesendrison/.agents
          sudo ln -s "$dotpi" /Users/famillesendrison/.pi/agent

          test "$(readlink "$baseline_home/.agents")" = "$dotagents"
          test "$(readlink "$baseline_home/.pi/agent")" = "$dotpi"
          test -f /Users/famillesendrison/.agents/agent-enforcers/permission-enforcer/src/core/state.ts
          test -f /Users/famillesendrison/.pi/agent/extensions/__tests__/pi-extension-loader.ts

          jiti_static_path=$(HOME="$baseline_home" bun --eval \
            'import { homedir } from "node:os"; process.stdout.write(Bun.resolveSync("jiti/static", homedir()));')
          test -f "$jiti_static_path"
          printf 'Resolved Jiti baseline path: %s\n' "$jiti_static_path"
          printf 'HOME=%s\n' "$baseline_home" >> "$GITHUB_ENV"

      - name: Run all 25 historical test surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/.pi/agent"
          test "$(node -e 'const i=require("./docs/migrations/node-pnpm/inventory.json");process.stdout.write(String(i.bunTestSurfaces.length))')" = "25"
          node -e 'const i=require("./docs/migrations/node-pnpm/inventory.json");for(const file of i.bunTestSurfaces)console.log(file)' \
            | xargs bun test --timeout 60000
